<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>项目三 - 个人简历</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Serif+SC:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <style>
    .project-page {
      min-height: 100vh;
      background-color: var(--color-bg);
      padding: var(--page-padding);
    }
    .project-page .back-link {
      display: inline-block;
      font-family: var(--font-body);
      font-size: var(--body-size);
      color: var(--color-link);
      text-decoration: none;
      margin-bottom: 40px;
      transition: opacity 0.2s;
    }
    .project-page .back-link:hover {
      opacity: 0.7;
    }
    .project-page .back-arrow {
      margin-right: 6px;
    }
    .project-page .project-hero {
      margin-bottom: 48px;
    }
    .project-page .project-hero h1 {
      font-family: var(--font-heading);
      font-size: var(--title-size);
      font-weight: var(--title-weight);
      letter-spacing: var(--title-spacing);
      line-height: var(--title-line-height);
      color: var(--color-heading);
      margin-bottom: 12px;
    }
    .project-page .project-hero .project-subtitle {
      font-family: var(--font-heading);
      font-size: var(--subtitle-size);
      font-weight: var(--subtitle-weight);
      letter-spacing: var(--subtitle-spacing);
      color: var(--color-sub);
    }
    .project-page .project-body {
      max-width: 720px;
      font-size: var(--body-size);
      line-height: var(--body-line-height);
      color: var(--color-text);
    }
    .project-page .placeholder-note {
      color: var(--color-sub);
      font-style: italic;
      margin-top: 32px;
      padding: 20px;
      border: var(--text-border-width) var(--text-border-style) var(--text-border-color);
      border-radius: var(--text-border-radius);
    }
  </style>
</head>
<body>
  <div class="project-page">
    <a href="index.html" class="back-link">
      <span class="back-arrow">←</span>返回简历
    </a>
    <div class="project-hero">
      <h1>项目三</h1>
      <p class="project-subtitle">TypeScript · Next.js · PostgreSQL</p>
    </div>
    <div class="project-body">
      <p class="placeholder-note">内容待添加 — 此处将展示项目的详细描述、背景、你的角色和成果。</p>
    </div>
  </div>
</body>
</html>
