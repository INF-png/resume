<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>简历生成 - 个人简历</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Serif+SC:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <style>
    .project-page {
      background-color: var(--color-bg);
      padding: var(--page-padding);
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .project-page .back-link {
      display: inline-block;
      font-family: var(--font-body);
      font-size: var(--body-size);
      color: var(--color-link);
      text-decoration: none;
      margin-bottom: 30px;
      transition: opacity 0.2s;
      align-self: flex-start;
    }
    .project-page .back-link:hover {
      opacity: 0.7;
    }
    .project-page .back-arrow {
      margin-right: 6px;
    }
    .project-page .project-hero {
      text-align: center;
      margin-bottom: 28px;
    }
    .project-page .project-hero h1 {
      font-family: var(--font-heading);
      font-size: var(--title-size);
      font-weight: var(--title-weight);
      letter-spacing: var(--title-spacing);
      line-height: var(--title-line-height);
      color: var(--color-heading);
      margin: 0 0 12px 0;
    }

    /* 下载按钮 */
    .download-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 12px 28px;
      font-family: var(--font-body);
      font-size: var(--body-size);
      color: #fff;
      background: var(--color-heading);
      border: none;
      border-radius: 4px;
      text-decoration: none;
      cursor: pointer;
      transition: opacity 0.2s;
      margin-bottom: 24px;
    }
    .download-btn:hover {
      opacity: 0.85;
    }
    .download-icon {
      font-size: 18px;
    }

    /* PDF 预览容器 */
    .pdf-preview {
      width: 100%;
      max-width: 900px;
      background: #fff;
      border: 1px solid var(--card-border);
      box-shadow: 0 2px 16px rgba(62, 39, 35, 0.08);
      border-radius: 4px;
      overflow: hidden;
      margin-bottom: 40px;
    }
    .pdf-preview embed {
      width: 100%;
      height: 100vh;
      min-height: 600px;
      border: none;
      display: block;
    }

    @media (max-width: 768px) {
      .pdf-preview embed {
        height: 90vh;
        min-height: 500px;
      }
    }
  </style>
</head>
<body>
  <div class="project-page">
    <a href="index.html" class="back-link">
      <span class="back-arrow">←</span>返回简历
    </a>
    <div class="project-hero">
      <h1>简历生成</h1>
    </div>

    <a href="assets/resume.pdf" class="download-btn" download>
      <span class="download-icon">↓</span> 下载简历 PDF
    </a>

    <div class="pdf-preview">
      <embed src="assets/resume.pdf" type="application/pdf">
    </div>
  </div>
</body>
</html>
